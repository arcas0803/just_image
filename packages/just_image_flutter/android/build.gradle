group 'dev.justimage.just_image_flutter'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'dev.justimage.just_image_flutter'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk 21
    }
}
