name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify version and native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version: //p' pubspec.yaml)
          test "$version" = "$package_version"
          ! grep -q PENDING lib/src/hook_helpers/hashes.dart
          gh release view "native-v$version" --json assets --jq '.assets[].name' > /tmp/native-assets.txt
          test "$(grep -c just_image_native /tmp/native-assets.txt)" -eq 12

      - name: Validate zero-configuration installation
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --chain-stack-traces
          dart pub publish --dry-run

      - name: Publish just_image
        run: dart pub publish --force
