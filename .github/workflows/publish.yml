name: Build native assets and publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            source: libjust_image_native.dylib
            artifact: libjust_image_native-macos-arm64.dylib
            static_source: libjust_image_native.a
            static_artifact: libjust_image_native-macos-arm64.a
          - os: macos-15-intel
            target: x86_64-apple-darwin
            source: libjust_image_native.dylib
            artifact: libjust_image_native-macos-x64.dylib
            static_source: libjust_image_native.a
            static_artifact: libjust_image_native-macos-x64.a
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            source: just_image_native.dll
            artifact: just_image_native-windows-x64.dll
            static_source: just_image_native.lib
            static_artifact: just_image_native-windows-x64.lib
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            source: just_image_native.dll
            artifact: just_image_native-windows-arm64.dll
            static_source: just_image_native.lib
            static_artifact: just_image_native-windows-arm64.lib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: src/native
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp "src/native/target/${{ matrix.target }}/release/${{ matrix.source }}" \
            "release-assets/${{ matrix.artifact }}"
          cp "src/native/target/${{ matrix.target }}/release/${{ matrix.static_source }}" \
            "release-assets/${{ matrix.static_artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  linux:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: libjust_image_native-linux-x64.so
            static_artifact: libjust_image_native-linux-x64.a
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: libjust_image_native-linux-arm64.so
            static_artifact: libjust_image_native-linux-arm64.a
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install build prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates cmake curl git nasm pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and stage binary
        working-directory: src/native
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir -p ../../release-assets
          cp "target/${{ matrix.target }}/release/libjust_image_native.so" \
            "../../release-assets/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/libjust_image_native.a" \
            "../../release-assets/${{ matrix.static_artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  ios:
    name: iOS ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: arm64
            os: macos-15
            targets: aarch64-apple-ios,aarch64-apple-ios-sim
          - runner: x64
            os: macos-15-intel
            targets: x86_64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build iOS binaries
        working-directory: src/native
        shell: bash
        run: |
          mkdir -p ../../release-assets
          if [[ "${{ matrix.runner }}" == "arm64" ]]; then
            cargo build --locked --release --target aarch64-apple-ios
            cp target/aarch64-apple-ios/release/libjust_image_native.dylib \
              ../../release-assets/libjust_image_native-ios-arm64.dylib
            cp target/aarch64-apple-ios/release/libjust_image_native.a \
              ../../release-assets/libjust_image_native-ios-arm64.a
            cargo build --locked --release --target aarch64-apple-ios-sim
            cp target/aarch64-apple-ios-sim/release/libjust_image_native.dylib \
              ../../release-assets/libjust_image_native-ios-simulator-arm64.dylib
            cp target/aarch64-apple-ios-sim/release/libjust_image_native.a \
              ../../release-assets/libjust_image_native-ios-simulator-arm64.a
          else
            cargo build --locked --release --target x86_64-apple-ios
            cp target/x86_64-apple-ios/release/libjust_image_native.dylib \
              ../../release-assets/libjust_image_native-ios-simulator-x64.dylib
            cp target/x86_64-apple-ios/release/libjust_image_native.a \
              ../../release-assets/libjust_image_native-ios-simulator-x64.a
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.runner }}
          path: release-assets/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  android:
    name: Android binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - name: Build Android binaries
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p release-assets
          for spec in \
            "aarch64-linux-android:aarch64-linux-android24-clang:arm64" \
            "armv7-linux-androideabi:armv7a-linux-androideabi24-clang:arm" \
            "x86_64-linux-android:x86_64-linux-android24-clang:x64"; do
            IFS=: read -r target compiler arch <<< "$spec"
            target_env=$(echo "$target" | tr '[:lower:]-' '[:upper:]_')
            cc_env=$(echo "$target" | tr '-' '_')
            case "$arch" in
              arm64) abi=arm64-v8a ;;
              arm) abi=armeabi-v7a ;;
              x64) abi=x86_64 ;;
            esac
            cmake_toolchain="$RUNNER_TEMP/android-$arch.cmake"
            cat > "$cmake_toolchain" <<EOF
          set(ANDROID_ABI "$abi" CACHE STRING "" FORCE)
          set(ANDROID_PLATFORM "android-24" CACHE STRING "" FORCE)
          include("$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake")
          EOF
            env \
              "CC_$cc_env=$toolchain/$compiler" \
              "CXX_$cc_env=$toolchain/${compiler/clang/clang++}" \
              "CMAKE_TOOLCHAIN_FILE_$cc_env=$cmake_toolchain" \
              "AR_$cc_env=$toolchain/llvm-ar" \
              "CARGO_TARGET_${target_env}_LINKER=$toolchain/$compiler" \
              "CARGO_ENCODED_RUSTFLAGS=$(printf -- '-C\037link-arg=-Wl,-z,max-page-size=16384\037-C\037link-arg=-Wl,-z,common-page-size=16384')" \
              cargo build --locked --release \
                --manifest-path src/native/Cargo.toml --target "$target"
            cp "src/native/target/$target/release/libjust_image_native.so" \
              "release-assets/libjust_image_native-android-$arch.so"
            cp "src/native/target/$target/release/libjust_image_native.a" \
              "release-assets/libjust_image_native-android-$arch.a"
          done
      - name: Verify Android ELF alignment
        run: python3 tool/verify_android_elf.py release-assets/libjust_image_native-android-*.so
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  publish:
    name: Verify and publish package
    needs: [desktop, linux, ios, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      # setup-dart exchanges the GitHub OIDC identity for a short-lived
      # pub.dev token. Installing Dart through Flutter alone does not perform
      # that exchange and would leave `dart pub publish` waiting for login.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version: //p' pubspec.yaml)
          rust_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/native/Cargo.toml | head -1)
          test "$version" = "$package_version"
          test "$version" = "$rust_version"

      - name: Generate native hashes and checksums
        shell: bash
        run: |
          dart pub get
          dart run tool/generate_hashes.dart release-assets "${GITHUB_REF_NAME#v}"
          sha256sum release-assets/* > release-assets/SHA256SUMS
          ! grep -q PENDING lib/src/hook_helpers/hashes.dart
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/src/hook_helpers/hashes.dart
          git commit -m "chore: embed native hashes for $GITHUB_REF_NAME"

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "just_image $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Validate zero-configuration consumers
        shell: bash
        run: |
          rm -rf .dart_tool example/cli/.dart_tool example/flutter_app/.dart_tool
          dart pub get
          dart analyze --fatal-infos lib test hook tool
          dart test --chain-stack-traces
          (cd example/cli && dart pub get && dart analyze && dart run bin/main.dart --output="$RUNNER_TEMP/just_image.webp")
          test -s "$RUNNER_TEMP/just_image.webp"
          (cd example/flutter_app && flutter pub get && flutter analyze && flutter test)
          (cd example/flutter_app && flutter build apk --release && flutter build appbundle --release)
          python3 tool/verify_android_elf.py example/flutter_app/build/app/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/*/libjust_image_native.so
          "$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)" -c -P 16 4 example/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force

  cleanup:
    name: Delete temporary artifacts
    if: always()
    needs: [desktop, linux, ios, android, publish]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
