name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: ${{ github.workspace }}/src/native/target

jobs:
  quality:
    name: Rust, Dart, Flutter ${{ matrix.flutter }} and package
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', '3.50.0']
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: false

      - name: Resolve dependencies
        run: |
          dart pub get
          (cd example/cli && dart pub get)
          (cd example/flutter_app && flutter pub get)

      - name: Test Android ELF verifier
        run: python3 tool/verify_android_elf_test.py

      - name: Check Rust
        working-directory: src/native
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check Dart
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code -- \
            lib/src/native_bindings.g.dart \
            lib/src/native_bindings.record_use_mapping.g.dart
          dart format --output=none --set-exit-if-changed \
            lib test hook tool example/cli \
            example/flutter_app/lib example/flutter_app/test
          dart analyze --fatal-infos lib test hook tool
          dart test --chain-stack-traces

      - name: Verify native tree shaking
        run: dart run tool/verify_tree_shaking.dart

      - name: Verify independent CLI
        working-directory: example/cli
        run: |
          dart pub get
          dart analyze
          dart run bin/main.dart --output="${{ runner.temp }}/just_image.webp"
          test -s "${{ runner.temp }}/just_image.webp"

      - name: Verify independent Flutter app
        working-directory: example/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Verify PDFium and Rust in the same Flutter process
        if: matrix.flutter == '3.50.0'
        working-directory: example/pdfrx
        run: flutter test

      - name: Validate pub.dev package
        run: dart pub publish --dry-run

  platforms:
    name: Native consumer · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Run Dart native integration tests
        run: |
          dart pub get
          dart analyze --fatal-infos lib test hook tool
          dart test --chain-stack-traces

      - name: Verify native tree shaking on host toolchain
        run: dart run tool/verify_tree_shaking.dart

      - name: Run Flutter native smoke test
        working-directory: example/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android:
    name: Android release packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - name: Package the native library for all Android ABIs
        working-directory: example/flutter_app
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter build apk --release
          flutter build appbundle --release
          python3 ../../tool/verify_android_elf.py build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab
          "$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)" -c -P 16 4 build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS device and simulator packaging
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - working-directory: example/flutter_app
        run: |
          flutter build ios --release --no-codesign
          flutter build ios --simulator --debug
