name: CI

on:
  push:
    branches: [main, v.2.0.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reuse native objects between the package and both consumer examples.
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

jobs:
  verify:
    name: Rust, Dart and Flutter consumers
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Resolve package dependencies
        run: dart pub get

      - name: Check Rust formatting and lints
        working-directory: src/native
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src/native
        run: cargo test --locked

      - name: Check Dart formatting and analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test hook tool example/cli example/flutter_app/lib example/flutter_app/test
          dart analyze --fatal-infos

      - name: Run real Dart to Rust integration tests
        run: dart test --chain-stack-traces

      - name: Verify independent CLI consumer
        working-directory: example/cli
        run: |
          dart pub get
          dart analyze
          dart run bin/main.dart --output=${{ runner.temp }}/just_image.webp
          test -s ${{ runner.temp }}/just_image.webp

      - name: Verify independent Flutter consumer
        working-directory: example/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Validate pub.dev package
        run: dart pub publish --dry-run
