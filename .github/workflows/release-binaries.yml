name: Prepare native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: 2.0.0

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            source: libjust_image_native.dylib
            artifact: libjust_image_native-macos-arm64.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            source: libjust_image_native.dylib
            artifact: libjust_image_native-macos-x64.dylib
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            source: just_image_native.dll
            artifact: just_image_native-windows-x64.dll
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            source: just_image_native.dll
            artifact: just_image_native-windows-arm64.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: src/native
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp "src/native/target/${{ matrix.target }}/release/${{ matrix.source }}" "release-assets/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  linux:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: libjust_image_native-linux-x64.so
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: libjust_image_native-linux-arm64.so
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and stage
        working-directory: src/native
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir -p ../../release-assets
          cp "target/${{ matrix.target }}/release/libjust_image_native.so" "../../release-assets/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  ios:
    name: iOS ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: arm64
            os: macos-15
            targets: aarch64-apple-ios,aarch64-apple-ios-sim
          - runner: x64
            os: macos-15-intel
            targets: x86_64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build iOS libraries
        working-directory: src/native
        run: |
          mkdir -p ../../release-assets
          if [[ "${{ matrix.runner }}" == "arm64" ]]; then
            cargo build --locked --release --target aarch64-apple-ios
            cp target/aarch64-apple-ios/release/libjust_image_native.dylib ../../release-assets/libjust_image_native-ios-arm64.dylib
            cargo build --locked --release --target aarch64-apple-ios-sim
            cp target/aarch64-apple-ios-sim/release/libjust_image_native.dylib ../../release-assets/libjust_image_native-ios-simulator-arm64.dylib
          else
            cargo build --locked --release --target x86_64-apple-ios
            cp target/x86_64-apple-ios/release/libjust_image_native.dylib ../../release-assets/libjust_image_native-ios-simulator-x64.dylib
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.runner }}
          path: release-assets/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  android:
    name: Android binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Build Android targets
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p release-assets
          for spec in \
            "aarch64-linux-android:aarch64-linux-android24-clang:arm64" \
            "armv7-linux-androideabi:armv7a-linux-androideabi24-clang:arm" \
            "x86_64-linux-android:x86_64-linux-android24-clang:x64"; do
            IFS=: read -r target compiler arch <<< "$spec"
            target_env=$(echo "$target" | tr '[:lower:]-' '[:upper:]_')
            cc_env=$(echo "$target" | tr '-' '_')
            env \
              "CC_$cc_env=$toolchain/$compiler" \
              "AR_$cc_env=$toolchain/llvm-ar" \
              "CARGO_TARGET_${target_env}_LINKER=$toolchain/$compiler" \
              cargo build --locked --release --manifest-path src/native/Cargo.toml --target "$target"
            cp "src/native/target/$target/release/libjust_image_native.so" \
              "release-assets/libjust_image_native-android-$arch.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  publish-assets:
    name: Publish binaries and prepare hashes
    needs: [desktop, linux, ios, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          dart pub get
          dart run tool/generate_hashes.dart release-assets "${{ inputs.version }}"
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Publish immutable native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-v${{ inputs.version }}" release-assets/* \
            --title "just_image native assets v${{ inputs.version }}" \
            --notes "Prebuilt native assets. Generated from $GITHUB_SHA."
      - name: Open hash update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: lib/src/hook_helpers/hashes.dart
          branch: release/native-hashes-${{ inputs.version }}
          commit-message: "chore: register native hashes for ${{ inputs.version }}"
          title: "chore: register native hashes for ${{ inputs.version }}"
          body: "Generated from the binaries published as native-v${{ inputs.version }}."
      - name: Delete temporary Actions artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
