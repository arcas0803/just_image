[package]
name = "just_image_native"
version = "3.0.0"
edition = "2021"
authors = ["just_image contributors"]
description = "High-performance image processing core for just_image Dart package"

[lib]
name = "just_image_native"
crate-type = ["cdylib", "staticlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp", "avif", "rayon"] }
avif-decode = { version = "=1.0.1", default-features = false }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images", "text"] }
little_exif = "0.6.23"
img-parts = "0.4"
rayon = "1.10"
kamadak-exif = "0.5"
oxipng = { version = "9", features = ["parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3"
rgb = "0.8"
# Release archives must be self-contained even when the build host has LCMS.
lcms2 = { version = "6", features = ["static"] }
fast_image_resize = { version = "4", features = ["image"] }
imageproc = { version = "0.25", default-features = false, features = ["rayon"] }
ab_glyph = "0.2"
blurhash = "0.2"

[profile.release]
opt-level = 3
# Thin LTO keeps cross-crate optimisation while substantially reducing release
# build time and CI minutes across the multi-platform binary matrix.
lto = "thin"
codegen-units = 1
panic = "unwind"
# Keep exported FFI symbols intact; only strip debug info.
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = true

[profile.release.build-override]
opt-level = 3
