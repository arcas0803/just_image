[package]
name = "just_image_native"
version = "3.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["just_image contributors"]
description = "High-performance image processing core for just_image Dart package"

[lib]
name = "just_image_native"
crate-type = ["cdylib", "staticlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp", "avif", "rayon"] }
resvg = { version = "0.50.0", default-features = false, features = ["raster-images", "text"] }
little_exif = "0.6.23"
img-parts = "0.4.2"
rayon = "1.12.0"
kamadak-exif = "0.6.2"
oxipng = { version = "10.2.1", features = ["parallel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
webp = "0.3"
rgb = "0.8"
# Release archives must be self-contained even when the build host has LCMS.
lcms2 = { version = "6.2.0", features = ["static"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }
ab_glyph = "0.2"
blurhash = "0.2"

# rav1d 1.1 requires nightly on ARM32. Keep the supported Android ARMv7
# target on the libaom backend until a stable-compatible release is available.
[target.'cfg(all(target_os = "android", target_arch = "arm"))'.dependencies]
avif-decode = { version = "=1.0.1", default-features = false }

[target.'cfg(not(all(target_os = "android", target_arch = "arm")))'.dependencies]
avif-decode = { version = "3.0.0", default-features = false }

[profile.release]
opt-level = 3
# Thin LTO keeps cross-crate optimisation while substantially reducing release
# build time and CI minutes across the multi-platform binary matrix.
lto = "thin"
codegen-units = 1
panic = "unwind"
# Keep exported FFI symbols intact; only strip debug info.
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = true

[profile.release.build-override]
opt-level = 3
